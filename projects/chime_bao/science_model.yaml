# The CHIME BAO science profile: the data a residual tolerance is priced from.
#
# The tolerance of a band is the smallest zeta * sigma / |b| over the required
# parameters and the forecast bins the band overlaps, at the target time,
# where sigma is a parameter's statistical error and b its bias per unit
# residual. A value is accepted only if the linear response is stable: moving
# the time by +/- time_fraction may change it by at most
# maximum_tolerance_ratio and may not flip the sign of b. Reported parameters
# are listed but set no tolerance.
#
# Each scenario is a delay-filter cut priced by its own response bank. The
# rule scenario is the one a verdict rests on; sensitivity scenarios are
# reported beside it and never enter a rule. suppression_key names the
# assumed suppression S of the residual, which is listed and never folded
# into a tolerance.
adapter: radiofisher_bao
experiment: chime2022
cosmology: planck2018
parameters:
  required: [aperp, apar]
  reported: [fs8]
target_years: 1.0
zeta: 1.0
year_grid: [1.0, 2.0, 3.0, 5.0, 8.0]
stability:
  time_fraction: 0.1
  maximum_tolerance_ratio: 1.2
scenarios:
  - {name: none, bank: fisher_bank_chime2022_pres_dense.npz, kfg_fac: null,
     suppression_key: none, role: rule}
  - {name: peak1, bank: fisher_bank_chime2022_pres_kfg22_dense.npz,
     kfg_fac: 22.0, suppression_key: bao_peak1, role: sensitivity}
  - {name: peak2, bank: fisher_bank_chime2022_pres_kfg44_dense.npz,
     kfg_fac: 44.0, suppression_key: bao_peak2, role: sensitivity}
  - {name: deployed, bank: fisher_bank_chime2022_pres_kfg80_dense.npz,
     kfg_fac: 80.0, suppression_key: aggressive_200ns, role: sensitivity}
