[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
# The repository is RFIsher; the distribution/import name stays 'baonoise' at
# v1.x because the shipped banks' source manifests hash src/baonoise/*.py, so
# renaming the package would invalidate every committed bank fingerprint.
name = "baonoise"
version = "1.0.0"
description = "RFIsher: RFI-masking noise-tolerance forecasts for 21cm BAO detection with RadioFisher + pilot-proxy (import name: baonoise)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dylan Gormley" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

# camb is only needed to regenerate the fiducial P(k) cache, and the caches
# this project uses are committed under data/. Requiring it forced a Fortran
# cosmology package on anyone who just wanted to run a forecast.
[project.optional-dependencies]
pk = ["camb"]
test = ["pytest"]

[project.scripts]
baonoise-forecast = "baonoise.cli:forecast_main"
baonoise-build-bank = "baonoise.cli:build_bank_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"baonoise.data" = ["*.npz", "*.csv", "*.json", "*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
