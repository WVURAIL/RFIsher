[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfisher"
version = "2.0.0"
description = "RFIsher maps masking and contamination residuals to Fisher-forecast science costs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dylan Gormley" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

# camb is only needed to regenerate the fiducial P(k) cache, and the caches
# this project uses are committed under data/. Requiring it forced a Fortran
# cosmology package on anyone who just wanted to run a forecast.
[project.optional-dependencies]
pk = ["camb"]
test = ["pytest"]

[project.scripts]
rfisher-forecast = "rfisher.cli:forecast_main"
rfisher-build-bank = "rfisher.cli:build_bank_main"
baonoise-forecast = "rfisher.cli:legacy_forecast_main"
baonoise-build-bank = "rfisher.cli:legacy_build_bank_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rfisher.data" = ["*.npz", "*.csv", "*.json", "*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
