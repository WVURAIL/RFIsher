[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfisher"
version = "5.0.0"
description = "How much residual DTV power each 6 MHz channel tolerates in a 21 cm BAO forecast."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dylan Gormley" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "radiofisher @ git+https://github.com/WVURAIL/RadioFisher.git@8294315814ff483f2aa5eb96e669a66a9e3dc8b3",
]

# camb is only needed to rebuild the P(k) table for a new cosmology.
[project.optional-dependencies]
pk = ["camb"]
test = ["pytest", "ruff"]

[project.scripts]
rfisher = "rfisher.cli:main"

[project.urls]
Repository = "https://github.com/WVURAIL/RFIsher"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rfisher", "rfisher.data"]

[tool.setuptools.package-data]
"rfisher.data" = ["*.dat", "*.csv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
