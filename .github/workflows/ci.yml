name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest -q
      # The paper number gate: every value quoted in paper/*.tex must
      # regenerate from the shipped out/*.csv tables.
      - run: python scripts/check_paper_numbers.py

  dissertation-figure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the TeX and Poppler figure toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern cm-super dvipng poppler-utils
      - name: Confirm the toolchain resolves
        run: |
          for tool in latex dvipng kpsewhich pdffonts pdfinfo; do
            command -v "$tool" || { echo "::error::missing $tool"; exit 1; }
          done
          # matplotlib's usetex preamble hard-requires these. type1ec comes
          # from cm-super and type1cm from texlive-latex-extra; without them
          # LaTeX fails with an opaque error rather than naming the package.
          for sty in type1ec type1cm lmodern underscore textcomp geometry \
                     amsmath amssymb fontenc inputenc; do
            kpsewhich "$sty.sty" >/dev/null \
              || { echo "::error::missing LaTeX package $sty.sty"; exit 1; }
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]" -c requirements/render.txt
      - name: Render the dissertation figure and audit its fonts
        run: |
          set -o pipefail
          python -m pytest -q -rs --no-header \
            tests/test_dissertation_figures.py \
            tests/test_render_forecast_template_assets.py | tee /tmp/figure.log
          if grep -Eq "dissertation figure.*need" /tmp/figure.log; then
            echo "::error::figure audit skipped even though the toolchain installed"
            exit 1
          fi

  radiofisher-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the reviewed RadioFisher backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WVURAIL/RadioFisher
          ref: 564b69cfa0b32a8678e75c99ae6012858570bfb6
          path: RadioFisher
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]" ./RadioFisher
      - name: Run pinned cross-repository contract tests
        env:
          RADIOFISHER_DIR: ${{ github.workspace }}/RadioFisher
        run: |
          python -m pytest -q tests/test_resources.py \
            -k 'packaged_pact_bank_matches or each_bull_research_bank_matches or each_bull_bank_interpolates'
          python scripts/verify_bank.py
          python scripts/restamp_bank_pins.py --check

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the checkout
        run: |
          wheel_path=$(find "$GITHUB_WORKSPACE/dist" -name 'rfisher-*.whl' -print -quit)
          python -m venv /tmp/rfisher-wheel-smoke
          /tmp/rfisher-wheel-smoke/bin/python -m pip install "$wheel_path"
          cd /tmp
          /tmp/rfisher-wheel-smoke/bin/python -c "import importlib.util, rfisher; assert rfisher.__version__ == '3.0.0'; assert importlib.util.find_spec('baonoise') is None"
          /tmp/rfisher-wheel-smoke/bin/python -m pip check
          /tmp/rfisher-wheel-smoke/bin/rfisher-forecast --cosmology planck2018 --uniform 0.0 --band dtv
          /tmp/rfisher-wheel-smoke/bin/rfisher-forecast --cosmology pact2025 --uniform 0.0 --band chime
          /tmp/rfisher-wheel-smoke/bin/rfisher-build-bank --help
          /tmp/rfisher-wheel-smoke/bin/python -c "from rfisher.fisherbank import BANK_SCHEMA_VERSION, FisherBank; from rfisher.resources import BANK_NAMES, RADIOFISHER_FILESYSTEM_NAMES, bank_file, filesystem_data_file; assert set(BANK_NAMES) == {'planck2018', 'pact2025'}; assert all(FisherBank(bank_file(name)).schema_version == BANK_SCHEMA_VERSION for name in BANK_NAMES); assert all(filesystem_data_file(name).is_file() for name in RADIOFISHER_FILESYSTEM_NAMES)"
