name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pip check
      - run: ruff check .
      - run: python -m pytest -q

  dissertation-figure:
    # The figures the dissertation shows, drawn from the shipped table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: rfisher figures --out "$RUNNER_TEMP/figures" --channels 19,36
      - run: test -s "$RUNNER_TEMP/figures/summary.png" && test -s "$RUNNER_TEMP/figures/channel_19.png" && test -s "$RUNNER_TEMP/figures/channel_36.png"
      - run: python docs/diagram.py && git diff --exit-code docs/rfisher_functions.svg

  radiofisher-integration:
    # RadioFisher at the pinned commit passes its own tests, and three channels
    # (both ends of the band and the control) rebuild to the shipped table.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out RadioFisher at the commit pyproject.toml pins
        run: |
          commit=$(grep -o 'RadioFisher.git@[0-9a-f]\{40\}' pyproject.toml | cut -d@ -f2)
          git clone -q https://github.com/WVURAIL/RadioFisher.git "$RUNNER_TEMP/RadioFisher"
          git -C "$RUNNER_TEMP/RadioFisher" checkout -q "$commit"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" -e "$RUNNER_TEMP/RadioFisher[test]"
      - run: python -m pytest -q "$RUNNER_TEMP/RadioFisher/tests"
      - run: rfisher table --out "$RUNNER_TEMP/table" --channels 14,29,37
      - name: The rebuilt rows match the shipped table
        run: |
          python - <<'PY'
          import os
          from rfisher import read_table
          shipped = {r["channel"]: r for r in read_table()["channels"]}
          fresh = read_table(os.path.join(os.environ["RUNNER_TEMP"], "table", "channel_table.json"))
          for r in fresh["channels"]:
              s = shipped[r["channel"]]
              for key in ("sigma_aperp", "sigma_apar", "response_aperp", "response_apar", "a_tol"):
                  assert abs(r[key] / s[key] - 1) < 1e-6, (r["channel"], key, r[key], s[key])
              assert r["binding"] == s["binding"]
          print("rebuilt", sorted(r["channel"] for r in fresh["channels"]))
          PY

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test the installed wheel outside the checkout
        run: |
          wheel_path=$(find "$GITHUB_WORKSPACE/dist" -name 'rfisher-*.whl' -print -quit)
          python -m venv /tmp/rfisher-wheel-smoke
          /tmp/rfisher-wheel-smoke/bin/python -m pip install "$wheel_path"
          cd /tmp
          /tmp/rfisher-wheel-smoke/bin/python -m pip check
          /tmp/rfisher-wheel-smoke/bin/rfisher --help > /dev/null
          /tmp/rfisher-wheel-smoke/bin/python -c "import rfisher; assert rfisher.__version__ == '5.0.0'; t = rfisher.read_table(); assert len(t['channels']) == 24; from rfisher import inputs; inputs.cosmology()"
