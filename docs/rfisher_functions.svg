<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1150" font-family="DejaVu Sans, sans-serif" role="img" aria-label="RFIsher call graph: fixed inputs, the per-channel forecast with the DTV residual, the tolerance and the table">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C2B39"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7F6310"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#002855"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#554741"/></marker></defs>
<rect width="1300" height="1150" fill="#F7F7F7"/>
<text x="24" y="34" font-size="19" fill="#1C2B39" font-weight="600" text-anchor="start" xml:space="preserve">RFIsher: one tolerance per 6 MHz channel</text>
<text x="24" y="56" font-size="13" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Main per-channel forecast path. Blue boxes call RadioFisher; the gold box is the DTV model.</text>
<text x="24" y="88" font-size="12" fill="#554741" font-weight="600" text-anchor="start" xml:space="preserve">FIXED INPUTS  (bands.py, inputs.py)</text>
<rect x="24" y="98" width="300" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="36" y="121" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">bands.channels()</text>
<text x="36" y="142" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">24 channels: DTV 14 to 36,</text>
<text x="36" y="160" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">control 37 (608-614 MHz)</text>
<text x="36" y="178" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">Band.z_min, z_max, z_center</text>
<text x="36" y="196" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">from the 6 MHz edges</text>
<rect x="340" y="98" width="300" height="118" rx="7" fill="#E0E5EB" stroke="#002855" stroke-width="1.3"/>
<text x="352" y="121" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.cosmology()</text>
<text x="352" y="142" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">latest: cmbspa2026 (SPT+ACT+Planck,</text>
<text x="352" y="160" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">DESI DR2); its P(k) table checked by</text>
<text x="352" y="178" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">pk_cache.cache_matches</text>
<text x="352" y="196" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">-&gt; radiofisher.load_power_spectrum</text>
<rect x="656" y="98" width="300" height="118" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="668" y="121" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.experiment()</text>
<text x="668" y="142" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">CHIME (radiofisher.chime)</text>
<text x="668" y="160" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">t = 8,760 h of retained data</text>
<text x="668" y="178" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">(one year)</text>
<rect x="972" y="98" width="304" height="118" rx="7" fill="#E0E5EB" stroke="#002855" stroke-width="1.3"/>
<text x="984" y="121" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.background()</text>
<text x="984" y="142" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">H(z), r(z), D(z), f(z)</text>
<text x="984" y="160" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.background_</text>
<text x="984" y="178" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">evolution_splines</text>
<line x1="174" y1="216" x2="174" y2="262" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="216" x2="490" y2="262" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="806" y1="216" x2="806" y2="262" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1124" y1="216" x2="1124" y2="262" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="264" width="1252" height="616" rx="9" fill="#FFFFFF" stroke="#1C2B39" stroke-width="2.2"/>
<text x="42" y="292" font-size="16" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">table.row(band)</text>
<text x="200" y="292" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">for each channel, in parallel under table.build_table()</text>
<rect x="44" y="306" width="600" height="156" rx="7" fill="#E0E5EB" stroke="#002855" stroke-width="1.3"/>
<text x="56" y="329" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">1  forecast.prepare(band)</text>
<text x="56" y="350" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.prepare_bin(z_min, z_max, ...)</text>
<text x="56" y="368" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">  the channel's own redshift, 6 MHz deep</text>
<text x="56" y="386" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher direct BAO derivative (step = 1e-7)</text>
<text x="56" y="404" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">residual.geometry(cosmo, expt)</text>
<text x="56" y="422" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">residual.coherent_shelf(g)  -&gt;  expt['P_res']</text>
<rect x="664" y="306" width="592" height="156" rx="7" fill="#F0ECE2" stroke="#7F6310" stroke-width="2.2"/>
<text x="676" y="329" font-size="14" fill="#7F6310" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">residual.coherent_shelf: the DTV model</text>
<text x="676" y="350" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">dP / C_N = a x N_nu x N_meas(k_perp) x f_w(k_perp)</text>
<text x="676" y="368" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">inside the wedge |k_par| &lt;= m k_perp + pi / L, else 0</text>
<text x="676" y="386" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">N_nu = 15.4 channels; N_meas = baselines per Fourier cell;</text>
<text x="676" y="404" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">f_w = pi / (L k_w) spreads one mode over the wedge;</text>
<text x="676" y="422" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">unit strength a = 1 (bias is proportional to a)</text>
<line x1="662" y1="420" x2="646" y2="420" stroke="#7F6310" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="344" y1="462" x2="344" y2="484" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="486" width="1212" height="118" rx="7" fill="#E0E5EB" stroke="#002855" stroke-width="1.3"/>
<text x="56" y="509" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">2  forecast.integrate(p)</text>
<text x="56" y="530" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.quadrature supplies model breakpoints; RFIsher adds residual.wedge_mu</text>
<text x="56" y="548" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">quadrature.quadrature_segments: Gauss-Legendre, 8 x 16 nodes; bounded paired batches</text>
<text x="56" y="566" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.quadrature.integrate_segments -&gt; shared fisher_integrands(..., paired=True)</text>
<text x="56" y="584" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">F_ij = Vfac x 2 Sum k^2 w d_i d_j   (13 x 13, the last row and column belong to the residual)</text>
<line x1="344" y1="604" x2="344" y2="626" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="628" width="1212" height="136" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="56" y="651" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">3  tolerance.tolerance(F, names)</text>
<text x="56" y="672" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.summarize_fisher: fit A, s_NL, alpha_perp, alpha_par, f sigma_8, b sigma_8</text>
<text x="56" y="690" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">C = (F_fit)^-1, the clean one-year covariance;   B = the '_Pres' column;   bias per unit a = C B</text>
<text x="56" y="708" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">FisherResult.project: caller supplies ln alpha_V = 2/3 ln alpha_perp + 1/3 ln alpha_par</text>
<text x="56" y="726" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">sigma_dv = sqrt(w C w);   response_dv = (w . bias) / sigma_dv,   w = (2/3, 1/3)</text>
<text x="56" y="744" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">delta ln D_V / sigma_dv = -a response_dv;   a_tol = 1 / |response_dv|</text>
<line x1="344" y1="764" x2="344" y2="786" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="788" width="1212" height="74" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="56" y="811" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">row</text>
<text x="56" y="832" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">channel, band, z_center, sigma_dv, response_dv, a_tol   (+ each dilation's sigma, bias and response)</text>
<line x1="330" y1="880" x2="330" y2="912" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="970" y1="880" x2="970" y2="912" stroke="#1C2B39" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="914" width="612" height="96" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="36" y="937" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">table.write_table(table, out)</text>
<text x="36" y="958" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">channel_table.json: rows + inputs + provenance</text>
<text x="36" y="976" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">(RFIsher and RadioFisher commits, P(k) table SHA-256)</text>
<text x="36" y="994" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">channel_table.csv: the rows</text>
<rect x="656" y="914" width="620" height="96" rx="7" fill="#FFFFFF" stroke="#1C2B39" stroke-width="1.3"/>
<text x="668" y="937" font-size="14" fill="#1C2B39" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">figures.draw_all(table, out)</text>
<text x="668" y="958" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">summary.png: tolerance, response and sigma by channel</text>
<text x="668" y="976" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">channel_NN.png: where the residual sits, and the bias</text>
<text x="668" y="994" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">of D_V against residual strength</text>
<rect x="24" y="1030" width="1252" height="100" rx="7" fill="#FFFFFF" stroke="#554741" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="36" y="1053" font-size="14" fill="#554741" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">full-coherence use: supply residual strength a at the forecast exposure</text>
<text x="36" y="1074" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">bias / sigma = a x |response_dv|; signed distance shift = -a x bias_dv_per_unit_a</text>
<text x="36" y="1092" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">sigma_dv is the clean distance uncertainty; a_tol is the first-order strength giving |bias| = sigma</text>
<text x="36" y="1110" font-size="12.5" fill="#554741" font-weight="normal" text-anchor="start" xml:space="preserve">stacking, gamma estimation and temporal-gain fits are outside scope; existing code is retained</text>
<line x1="330" y1="1010" x2="330" y2="1028" stroke="#554741" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m)"/>
</svg>
