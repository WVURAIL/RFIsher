<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1150" font-family="DejaVu Sans, sans-serif" role="img" aria-label="RFIsher call graph: fixed inputs, the per-channel forecast with the DTV residual, the tolerance and the table">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2126"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a5a00"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6168"/></marker></defs>
<rect width="1300" height="1150" fill="#f6f7f5"/>
<text x="24" y="34" font-size="19" fill="#1c2126" font-weight="600" text-anchor="start" xml:space="preserve">RFIsher: one tolerance per 6 MHz channel</text>
<text x="24" y="56" font-size="13" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">Every function, run once per channel. Blue boxes call RadioFisher; the amber box is the DTV model.</text>
<text x="24" y="88" font-size="12" fill="#5a6168" font-weight="600" text-anchor="start" xml:space="preserve">FIXED INPUTS  (bands.py, inputs.py)</text>
<rect x="24" y="98" width="300" height="118" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="36" y="121" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">bands.channels()</text>
<text x="36" y="142" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">24 channels: DTV 14 to 36,</text>
<text x="36" y="160" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">control 37 (608-614 MHz)</text>
<text x="36" y="178" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">Band.z_min, z_max, z_center</text>
<text x="36" y="196" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">from the 6 MHz edges</text>
<rect x="340" y="98" width="300" height="118" rx="7" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.3"/>
<text x="352" y="121" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.cosmology()</text>
<text x="352" y="142" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">Planck 2018 (radiofisher.chime)</text>
<text x="352" y="160" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">pk_planck2018.dat, checked by</text>
<text x="352" y="178" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">pk_cache.cache_matches</text>
<text x="352" y="196" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">-&gt; radiofisher.load_power_spectrum</text>
<rect x="656" y="98" width="300" height="118" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="668" y="121" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.experiment()</text>
<text x="668" y="142" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">CHIME (radiofisher.chime)</text>
<text x="668" y="160" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">t = 8,760 h of retained data</text>
<text x="668" y="178" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">(one year)</text>
<rect x="972" y="98" width="304" height="118" rx="7" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.3"/>
<text x="984" y="121" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">inputs.background()</text>
<text x="984" y="142" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">H(z), r(z), D(z), f(z)</text>
<text x="984" y="160" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.background_</text>
<text x="984" y="178" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">evolution_splines</text>
<line x1="174" y1="216" x2="174" y2="262" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="490" y1="216" x2="490" y2="262" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="806" y1="216" x2="806" y2="262" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1124" y1="216" x2="1124" y2="262" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="264" width="1252" height="616" rx="9" fill="#ffffff" stroke="#1c2126" stroke-width="2.2"/>
<text x="42" y="292" font-size="16" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">table.row(band)</text>
<text x="200" y="292" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">for each channel, in parallel under table.build_table()</text>
<rect x="44" y="306" width="600" height="156" rx="7" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.3"/>
<text x="56" y="329" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">1  forecast.prepare(band)</text>
<text x="56" y="350" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.prepare_bin(z_min, z_max, ...)</text>
<text x="56" y="368" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">  the channel's own redshift, 6 MHz deep</text>
<text x="56" y="386" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">BAO template slope taken directly at each k</text>
<text x="56" y="404" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">residual.geometry(cosmo, expt)</text>
<text x="56" y="422" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">residual.coherent_shelf(g)  -&gt;  expt['P_res']</text>
<rect x="664" y="306" width="592" height="156" rx="7" fill="#fff4e0" stroke="#9a5a00" stroke-width="2.2"/>
<text x="676" y="329" font-size="14" fill="#9a5a00" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">residual.coherent_shelf: the DTV model</text>
<text x="676" y="350" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">dP / C_N = a x N_nu x N_meas(k_perp) x f_w(k_perp)</text>
<text x="676" y="368" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">inside the wedge |k_par| &lt;= m k_perp + pi / L, else 0</text>
<text x="676" y="386" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">N_nu = 15.4 channels; N_meas = baselines per Fourier cell;</text>
<text x="676" y="404" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">f_w = pi / (L k_w) spreads one mode over the wedge;</text>
<text x="676" y="422" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">unit strength a = 1 (bias is proportional to a)</text>
<line x1="662" y1="420" x2="646" y2="420" stroke="#9a5a00" stroke-width="1.5" marker-end="url(#b)"/>
<line x1="344" y1="462" x2="344" y2="484" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="486" width="1212" height="118" rx="7" fill="#eef4fb" stroke="#1f5fa8" stroke-width="1.3"/>
<text x="56" y="509" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">2  forecast.integrate(p)</text>
<text x="56" y="530" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">radial_edges, angular_edges (+ residual.wedge_mu): split k and mu at every kink of the integrand</text>
<text x="56" y="548" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">Gauss-Legendre, 8 nodes per k segment x 16 per mu segment;  at each node:</text>
<text x="56" y="566" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">radiofisher.fisher_integrands(k, mu, cosmo, expt)  -&gt;  12 parameter rows and the '_Pres' row</text>
<text x="56" y="584" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">F_ij = Vfac x 2 Sum k^2 w d_i d_j   (13 x 13, the last row and column belong to the residual)</text>
<line x1="344" y1="604" x2="344" y2="626" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="628" width="1212" height="136" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="56" y="651" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">3  tolerance.tolerance(F, names)</text>
<text x="56" y="672" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">fit six: A, sigma_NL, alpha_perp, alpha_par, f sigma_8, b sigma_8; hold the rest at the fiducial</text>
<text x="56" y="690" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">C = (F_fit)^-1, the clean one-year covariance;   B = the '_Pres' column;   bias per unit a = C B</text>
<text x="56" y="708" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">combine the dilations as the CHIME Overview does: ln alpha_V = 2/3 ln alpha_perp + 1/3 ln alpha_par</text>
<text x="56" y="726" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">sigma_dv = sqrt(w C w);   response_dv = (w . bias) / sigma_dv,   w = (2/3, 1/3)</text>
<text x="56" y="744" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">a_tol = 1 / |response_dv|  -- the strength at which the bias of D_V equals its sigma</text>
<line x1="344" y1="764" x2="344" y2="786" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="44" y="788" width="1212" height="74" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="56" y="811" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">row</text>
<text x="56" y="832" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">channel, band, z_center, sigma_dv, response_dv, a_tol   (+ each dilation's sigma, bias and response)</text>
<line x1="330" y1="880" x2="330" y2="912" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="970" y1="880" x2="970" y2="912" stroke="#1c2126" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="24" y="914" width="612" height="96" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="36" y="937" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">table.write_table(table, out)</text>
<text x="36" y="958" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">channel_table.json: rows + inputs + provenance</text>
<text x="36" y="976" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">(RFIsher and RadioFisher commits, P(k) table SHA-256)</text>
<text x="36" y="994" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">channel_table.csv: the rows</text>
<rect x="656" y="914" width="620" height="96" rx="7" fill="#ffffff" stroke="#1c2126" stroke-width="1.3"/>
<text x="668" y="937" font-size="14" fill="#1c2126" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">figures.draw_all(table, out)</text>
<text x="668" y="958" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">summary.png: tolerance, response and sigma by channel</text>
<text x="668" y="976" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">channel_NN.png: where the residual sits, and the bias</text>
<text x="668" y="994" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">of D_V against residual strength</text>
<rect x="24" y="1030" width="1252" height="100" rx="7" fill="#ffffff" stroke="#5a6168" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="36" y="1053" font-size="14" fill="#5a6168" font-weight="600" text-anchor="start" font-family="DejaVu Sans Mono, monospace" xml:space="preserve">downstream, not in RFIsher: the detector side reads the table</text>
<text x="36" y="1074" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">for each threshold:  power x and kept fraction kappa from the archive histogram</text>
<text x="36" y="1092" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">a = (c x)^2 x 16,384 x G   (c = coherent fraction, G = 1 frame);   bias / sigma of D_V = a x |response_dv|</text>
<text x="36" y="1110" font-size="12.5" fill="#5a6168" font-weight="normal" text-anchor="start" xml:space="preserve">rule: the knee if bias / sigma &lt;= 1, else the passing threshold closest to it, else word 0x1;   time = 1 / kappa</text>
<line x1="330" y1="1010" x2="330" y2="1028" stroke="#5a6168" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#m)"/>
</svg>
